name: minimal_validation_stage1
# Stage 1 of the protocol run: one training seed first (回复学生 §五 共用规矩 3 allows
# "可以先只有1个，但最后需要全量"), ten scenario instances per cause, protocol budget.
# Stage 2 adds seeds 1 and 2 with the same banks.
seeds: [0]
selectors: [fixed, rule, oracle]
families: [pack]
H_values: [4]
scenario_banks: 2
init_budget: 80000
round_budget: 40000
rounds: 3
feedback_episodes: 8
curve_n_per: 20
final_n_per: 20
feedback_pert: 0.1
collection_pert: 0.1
torch_threads: 4
deploy_budget: 100000
label_budget: 1000000
banks: {training: 81000000, feedback: 82800000, curve: 91000000, final: 84000000}
world: {plate_half: 0.01, tray_height: 0.02}
train: {steps: 8000, hidden: 512, layers: 3, batch: 2048, lr: 0.001, device: cuda}
open_loop: {recovery_frac: 0.3, latency_choices: [0, 0, 1]}
scenarios:
  - name: geometry
    cause: geometry_bias
    conditions: {recon: {bias: {plate: 0.46, tray: 0.46}}}
    train_randomization: {layout_prior: full}
  - name: coverage
    cause: coverage_deficit
    conditions: {recon: {}}
    train_randomization: {layout_prior: left_half}
