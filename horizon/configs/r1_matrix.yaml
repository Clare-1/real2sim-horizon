name: r1_matrix
# R1: which operation helps which cause. Bias level 0.46 is calibrated, not guessed:
# results/bias_calibration_20261112 shows pi0 at 0.333/0.400 SR for 9.1 mm believed height,
# versus 1.000 at the correct 20 mm and 0.000 at E1's 6 mm. See the README for the full curve.
seeds: [0, 1, 2]
families: [pack]
H_values: [4]
init_budget: 80000
round_budget: 12000
feedback_episodes: 24
curve_n_per: 20
rounds: 3
feedback_pert: 0.1
collection_pert: 0.1
torch_threads: 4
banks: {training: 91000000, feedback: 92000000, curve: 93000000, final: 94000000}
world: {plate_half: 0.01, tray_height: 0.02}
train: {steps: 8000, hidden: 512, layers: 3, batch: 2048, lr: 0.001, device: cuda}
open_loop: {recovery_frac: 0.3, latency_choices: [0, 0, 1]}
scenarios:
  - name: geometry
    cause: geometry_bias
    conditions: {recon: {bias: {plate: 0.46, tray: 0.46}}}
    train_randomization: {layout_prior: full}
  - name: coverage
    cause: coverage_deficit
    conditions: {recon: {}}
    train_randomization: {layout_prior: left_half}
