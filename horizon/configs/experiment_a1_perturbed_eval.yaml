# Table A1 (appendix): does the selector ranking survive a perturbation-heavy evaluation?
#
# The main table evaluates in *nominal* conditions (only `recovery` is perturbed, by design).
# A reviewer will ask whether the ordering is an artefact of a clean evaluation, so here every
# cause is evaluated under `eval_mode: perturbed` with eval_pert 0.7 - the same protocol the
# mixed-cause grid used.  Only the three selectors that carry the paper's claims (fixed / rule /
# oracle) are included: 4 causes x 2 banks x 3 selectors = 24 cells.
#
# If a cause becomes unsolvable under 0.7 perturbation, that is itself the A1 result: it says the
# perturbation budget, not the selector, is binding there.
name: experiment_a1_perturbed_eval
seeds:
- 0
selectors:
- fixed
- rule
- oracle
families:
- pack
H_values:
- 4
scenario_banks: 2
init_budget: 80000
round_budget: 40000
rounds: 3
feedback_episodes: 24
curve_n_per: 20
final_n_per: 20
feedback_pert: 0.5
collection_pert: 0.1
torch_threads: 4
deploy_budget: 100000
label_budget: 1000000
banks:
  training: 81000000
  feedback: 82000000
  curve: 83000000
  final: 84000000
world:
  plate_half: 0.01
  tray_height: 0.02
train:
  steps: 8000
  hidden: 512
  layers: 3
  batch: 2048
  lr: 0.001
  device: cuda
open_loop:
  recovery_frac: 0.3
  latency_choices:
  - 0
  - 0
  - 1
scenarios:
- name: geometry
  cause: geometry_bias
  conditions:
    recon:
      bias:
        plate: 0.46
        tray: 0.46
  train_randomization:
    layout_prior: full
  eval_mode: perturbed
  eval_pert: 0.7
- name: coverage
  cause: coverage_deficit
  conditions:
    recon: {}
  train_randomization:
    layout_prior: left_half
  eval_mode: perturbed
  eval_pert: 0.7
- name: recovery
  cause: recovery_deficit
  conditions:
    recon: {}
  train_randomization:
    layout_prior: full
  open_loop:
    recovery_frac: 0.0
  eval_mode: perturbed
  eval_pert: 0.7
- name: healthy
  cause: healthy
  conditions:
    recon: {}
  train_randomization:
    layout_prior: full
  eval_mode: perturbed
  eval_pert: 0.7
