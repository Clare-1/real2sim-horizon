# Table 9 (experiment 5): bias-response curve at the current 4-cause protocol.
# One geometry scenario at three reconstruction-bias levels (0.20 / 0.46 / 0.70), same banks.
# 0.46 is the calibrated default (pi0 SR 0.333/0.400); 0.20 is mild, 0.70 is strong.
# fixed / rule / oracle only: the question is how much a strategy can recover as the twin drifts.
name: experiment5_bias_levels
seeds:
- 0
selectors:
- fixed
- rule
- oracle
families:
- pack
H_values:
- 4
scenario_banks: 2
init_budget: 80000
round_budget: 40000
rounds: 3
feedback_episodes: 24
curve_n_per: 20
final_n_per: 20
feedback_pert: 0.1
collection_pert: 0.1
torch_threads: 4
deploy_budget: 100000
label_budget: 1000000
banks:
  training: 81000000
  feedback: 82000000
  curve: 83000000
  final: 84000000
world:
  plate_half: 0.01
  tray_height: 0.02
train:
  steps: 8000
  hidden: 512
  layers: 3
  batch: 2048
  lr: 0.001
  device: cuda
open_loop:
  recovery_frac: 0.3
  latency_choices:
  - 0
  - 0
  - 1
scenarios:
- name: bias_020
  cause: geometry_bias
  conditions:
    recon:
      bias:
        plate: 0.2
        tray: 0.2
  train_randomization:
    layout_prior: full
- name: bias_046
  cause: geometry_bias
  conditions:
    recon:
      bias:
        plate: 0.46
        tray: 0.46
  train_randomization:
    layout_prior: full
- name: bias_070
  cause: geometry_bias
  conditions:
    recon:
      bias:
        plate: 0.7
        tray: 0.7
  train_randomization:
    layout_prior: full
