name: experiment_llm_grid
# The LLM selector as a real row in the main table: 4 causes x 2 banks x 1 seed = 8 runs.
# Each run makes at most `rounds` calls (4), so 32 calls at ~$0.002 = ~$0.07 in total.
# The credential comes from HORIZON_LLM_KEY; the key itself is never written into the config.
seeds:
- 0
selectors:
- llm
llm:
  provider: openai
  base_url: https://minara.cloud/v1
  model: openai/gpt-6.2-astra
  api_key_env: HORIZON_LLM_KEY
  max_calls: 6
  max_usd: 0.05
  price_in_per_mtok: 3.0
  price_out_per_mtok: 15.0
  max_tokens: 512
families:
- pack
H_values:
- 4
scenario_banks: 2
init_budget: 80000
round_budget: 40000
rounds: 4
feedback_episodes: 24
curve_n_per: 20
final_n_per: 20
feedback_pert: 0.1
collection_pert: 0.1
torch_threads: 4
deploy_budget: 100000
label_budget: 1000000
banks:
  training: 81000000
  feedback: 82000000
  curve: 83000000
  final: 84000000
world:
  plate_half: 0.01
  tray_height: 0.02
train:
  steps: 8000
  hidden: 512
  layers: 3
  batch: 2048
  lr: 0.001
  device: cuda
scenarios:
- name: geometry
  cause: geometry_bias
  conditions:
    recon:
      bias:
        plate: 0.46
        tray: 0.46
  train_randomization:
    layout_prior: full
- name: coverage
  cause: coverage_deficit
  conditions:
    recon: {}
  train_randomization:
    layout_prior: left_half
- name: recovery
  cause: recovery_deficit
  conditions:
    recon: {}
  train_randomization:
    layout_prior: full
  feedback_pert: 0.5
- name: healthy
  cause: healthy
  conditions:
    recon: {}
  train_randomization:
    layout_prior: full
