# LLM vs the hand-written rule on MIXED causes (the rule's structural blind spot).
#
# Why this is the fair place to measure the LLM's value:
#   * On pure causes the rule is already at 0.90-0.93 and the LLM ties it (table 10), so a
#     comparison there only measures prompt plumbing.
#   * On mixed causes the rule has a *structural* blind spot: `regenerate_targeted` is gated on
#     cumulative `labels_spent < 20k`. After the 80k initial dump that gate is closed forever, so
#     the rule can calibrate the twin but can never localise the second cause. The LLM sees the
#     same observable profile (residual, per-subgoal counts, labels_spent) and can still pick the
#     targeted regeneration.
#   * `rule` here is the rule EXACTLY as published; the repaired-label-threshold version runs in
#     experiment_llm_mixed_rulefix.yaml so the LLM is not compared against a strawman.
#
# 3 mixed conditions x 2 banks x {rule, llm, llm_memory, oracle} = 24 cells; 8 LLM cells (~24 calls).
name: experiment_llm_mixed
seeds:
- 0
selectors:
- rule
- llm
- llm_memory
- oracle
families:
- pack
H_values:
- 4
scenario_banks: 2
init_budget: 80000
round_budget: 40000
rounds: 3
feedback_episodes: 24
curve_n_per: 20
final_n_per: 20
feedback_pert: 0.1
collection_pert: 0.1
torch_threads: 4
deploy_budget: 100000
label_budget: 1000000
banks:
  training: 81000000
  feedback: 82000000
  curve: 83000000
  final: 84000000
world:
  plate_half: 0.01
  tray_height: 0.02
train:
  steps: 8000
  hidden: 512
  layers: 3
  batch: 2048
  lr: 0.001
  device: cuda
open_loop:
  recovery_frac: 0.3
  latency_choices:
  - 0
  - 0
  - 1
llm:
  provider: openai
  base_url: https://minara.cloud/v1
  model: openai/gpt-6.2-astra
  api_key_env: HORIZON_LLM_KEY
  max_calls: 6
  max_usd: 0.05
  max_tokens: 512
  price_in_per_mtok: 3.0
  price_out_per_mtok: 15.0
llm_overrides:
  llm_memory:
    memory:
    - 'past geometry scenario: large calibration residual, calibrating the twin first
      helped most'
    - 'past coverage scenario: half-support demonstrations, targeted layout regeneration
      helped most'
    - 'past healthy scenario: already successful, stopping saved budget'
    - 'past perturbed scenario: recovery demonstrations did not change the outcome'
scenarios:
- name: mixed_gc
  cause: mixed_gc
  conditions: &mixed_gc
    recon:
      bias:
        plate: 0.46
        tray: 0.46
  train_randomization:
    layout_prior: left_half
- name: mixed_cr
  cause: mixed_cr
  conditions:
    recon: {}
  train_randomization:
    layout_prior: left_half
  open_loop:
    recovery_frac: 0.0
  feedback_pert: 0.5
  eval_mode: perturbed
  eval_pert: 0.7
- name: mixed_gcr
  cause: mixed_gcr
  conditions: *mixed_gc
  train_randomization:
    layout_prior: left_half
  open_loop:
    recovery_frac: 0.0
  feedback_pert: 0.5
  eval_mode: perturbed
  eval_pert: 0.7
