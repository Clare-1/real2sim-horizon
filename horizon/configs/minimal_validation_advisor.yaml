name: minimal_validation_advisor
# Advisor §3.6 minimal validation: pack H=4, 2 causes x 10 banks x 3 seeds x 4 selectors.
# Seed 0 is already done (80 runs, 2026-11-21); this run adds seeds 1-2 (160 runs, ~11 h) and
# reuses the existing seed-0 records. No offline-trained selector, so no model leakage.
seeds: [0, 1, 2]
selectors: [fixed, rule, bandit, oracle]
families: [pack]
H_values: [4]
scenario_banks: 10
init_budget: 80000
round_budget: 40000
rounds: 3
feedback_episodes: 24
curve_n_per: 20
final_n_per: 20
feedback_pert: 0.1
collection_pert: 0.1
torch_threads: 4
deploy_budget: 100000
label_budget: 1000000
banks: {training: 81000000, feedback: 82000000, curve: 83000000, final: 84000000}
world: {plate_half: 0.01, tray_height: 0.02}
train: {steps: 8000, hidden: 512, layers: 3, batch: 2048, lr: 0.001, device: cuda}
open_loop: {recovery_frac: 0.3, latency_choices: [0, 0, 1]}
scenarios:
  - name: geometry
    cause: geometry_bias
    conditions: {recon: {bias: {plate: 0.46, tray: 0.46}}}
    train_randomization: {layout_prior: full}
  - name: coverage
    cause: coverage_deficit
    conditions: {recon: {}}
    train_randomization: {layout_prior: left_half}
