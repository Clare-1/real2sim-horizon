name: minimal_validation_smoke
seeds: [0]
selectors: [fixed, rule, oracle]
families: [pack]
H_values: [4]
init_budget: 300
round_budget: 200
rounds: 2
feedback_episodes: 4
curve_n_per: 2
final_n_per: 2
feedback_pert: 0.1
collection_pert: 0.1
torch_threads: 4
deploy_budget: 1000
label_budget: 100000
banks: {training: 71000000, feedback: 72000000, curve: 73000000, final: 74000000}
world: {plate_half: 0.01, tray_height: 0.02}
train: {steps: 20, hidden: 32, layers: 2, batch: 64, lr: 0.001, device: cuda}
open_loop: {recovery_frac: 0.3, latency_choices: [0, 0, 1]}
scenarios:
  - name: geometry
    cause: geometry_bias
    conditions: {recon: {bias: {plate: 0.3, tray: 0.3}}}
    train_randomization: {layout_prior: full}
  - name: coverage
    cause: coverage_deficit
    conditions: {recon: {}}
    train_randomization: {layout_prior: left_half}
