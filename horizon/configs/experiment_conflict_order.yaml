# Conflict / order experiment: identical operations, different orders, identical causes and
# banks. 2 causes x 8 two-operation sequences x 2 banks = 32 runs.
# Read-out: C->T vs T->C, C->U vs U->C, C->D vs D->C, and the same-operation-twice controls.
# Requires the `seq:` selector (horizon/rsi/sequences.py) to be registered in make_selector.
name: experiment_conflict_order
seeds:
- 0
selectors:
- seq:calibrate_geometry+regenerate_targeted
- seq:regenerate_targeted+calibrate_geometry
- seq:regenerate_targeted+regenerate_targeted
- seq:calibrate_geometry+calibrate_geometry
- seq:calibrate_geometry+regenerate_uniform
- seq:regenerate_uniform+calibrate_geometry
- seq:calibrate_geometry+dagger_round
- seq:dagger_round+calibrate_geometry
families:
- pack
H_values:
- 4
scenario_banks: 2
init_budget: 80000
round_budget: 40000
rounds: 3
feedback_episodes: 24
curve_n_per: 20
final_n_per: 20
feedback_pert: 0.1
collection_pert: 0.1
torch_threads: 4
deploy_budget: 100000
label_budget: 1000000
banks:
  training: 81000000
  feedback: 82000000
  curve: 83000000
  final: 84000000
world:
  plate_half: 0.01
  tray_height: 0.02
train:
  steps: 8000
  hidden: 512
  layers: 3
  batch: 2048
  lr: 0.001
  device: cuda
open_loop:
  recovery_frac: 0.3
  latency_choices:
  - 0
  - 0
  - 1
scenarios:
- name: geometry
  cause: geometry_bias
  conditions:
    recon:
      bias:
        plate: 0.46
        tray: 0.46
  train_randomization:
    layout_prior: full
- name: coverage
  cause: coverage_deficit
  conditions:
    recon: {}
  train_randomization:
    layout_prior: left_half
