# Paper batch: 4 causes x 3 banks x 3 seeds x 8 selectors = 288 runs (~19 h at ~4 min/run).
# The multilabel selector uses a model trained WITHOUT profile banks 0-2 and without
# results/four_causes_20261118, so the three paper evaluation banks are held out.
# See 重跑风险审计_2026-11-18.md section 15.4.
name: minimal_validation_4causes_paper8
seeds:
- 0
- 1
- 2
selectors:
- fixed
- rule
- random
- round_robin
- bandit
- linucb
- multilabel
- oracle
families:
- pack
H_values:
- 4
scenario_banks: 3
init_budget: 80000
round_budget: 40000
rounds: 3
feedback_episodes: 24
curve_n_per: 20
final_n_per: 20
feedback_pert: 0.1
collection_pert: 0.1
torch_threads: 4
deploy_budget: 100000
label_budget: 1000000
banks:
  training: 81000000
  feedback: 82000000
  curve: 83000000
  final: 84000000
world:
  plate_half: 0.01
  tray_height: 0.02
train:
  steps: 8000
  hidden: 512
  layers: 3
  batch: 2048
  lr: 0.001
  device: cuda
open_loop:
  recovery_frac: 0.3
  latency_choices:
  - 0
  - 0
  - 1
scenarios:
- name: geometry
  cause: geometry_bias
  conditions:
    recon:
      bias:
        plate: 0.46
        tray: 0.46
  train_randomization:
    layout_prior: full
- name: coverage
  cause: coverage_deficit
  conditions:
    recon: {}
  train_randomization:
    layout_prior: left_half
- name: recovery
  cause: recovery_deficit
  conditions:
    recon: {}
  train_randomization:
    layout_prior: full
  open_loop:
    recovery_frac: 0.0
  feedback_pert: 0.5
  eval_mode: perturbed
  eval_pert: 0.7
- name: healthy
  cause: healthy
  conditions:
    recon: {}
  train_randomization:
    layout_prior: full
multilabel_model: results/diagnosability_multilabel_20261118/multilabel_model_heldout_paper.json
