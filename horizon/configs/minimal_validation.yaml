name: minimal_validation
# Protocol budget per 回复学生 §五 共用规矩 1: 80k init, +40k per round, 8000 steps, 24 feedback.
# Bias 0.46 is calibrated by pi0 SR (0.333/0.400), not guessed; see results/bias_calibration_20261112.
# scenario_banks = 10 gives the advisor's "two causes x ten scenarios each"; D0 is shared per
# (cause, seed) so only the deployment/feedback banks differ.
seeds: [0, 1, 2]
selectors: [fixed, rule, oracle]
families: [pack]
H_values: [4]
scenario_banks: 10
init_budget: 80000
round_budget: 40000
rounds: 3
feedback_episodes: 24
curve_n_per: 20
final_n_per: 20
feedback_pert: 0.1
collection_pert: 0.1
torch_threads: 4
deploy_budget: 100000
label_budget: 1000000
banks: {training: 81000000, feedback: 82000000, curve: 83000000, final: 84000000}
world: {plate_half: 0.01, tray_height: 0.02}
train: {steps: 8000, hidden: 512, layers: 3, batch: 2048, lr: 0.001, device: cuda}
open_loop: {recovery_frac: 0.3, latency_choices: [0, 0, 1]}
scenarios:
  - name: geometry
    cause: geometry_bias
    conditions: {recon: {bias: {plate: 0.46, tray: 0.46}}}
    train_randomization: {layout_prior: full}
  - name: coverage
    cause: coverage_deficit
    conditions: {recon: {}}
    train_randomization: {layout_prior: left_half}

