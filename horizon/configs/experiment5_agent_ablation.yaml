# Table 10 (experiment 5): LLM agent ablation at the same 4-cause grid.
#   llm         full action set, no memory            (matches results/four_causes_llm_20261122)
#   llm_memory  + operator-supplied lessons           ("LLM + experience")
#   llm_minimal specialist tools withheld             (only calibrate / dagger / stop)
#   llm_cheap   cheaper model on the same endpoint
# Credentials come from the out-of-repo env file (~/.config/horizon/llm.env); never from here.
# Cost guards: max_calls / max_usd are per run and fail loudly instead of overspending.
name: experiment5_agent_ablation
seeds:
- 0
selectors:
- llm
- llm_memory
- llm_minimal
- llm_cheap
families:
- pack
H_values:
- 4
scenario_banks: 2
init_budget: 80000
round_budget: 40000
rounds: 3
feedback_episodes: 24
curve_n_per: 20
final_n_per: 20
feedback_pert: 0.1
collection_pert: 0.1
torch_threads: 4
deploy_budget: 100000
label_budget: 1000000
banks:
  training: 81000000
  feedback: 82000000
  curve: 83000000
  final: 84000000
world:
  plate_half: 0.01
  tray_height: 0.02
train:
  steps: 8000
  hidden: 512
  layers: 3
  batch: 2048
  lr: 0.001
  device: cuda
open_loop:
  recovery_frac: 0.3
  latency_choices:
  - 0
  - 0
  - 1
scenarios:
- name: geometry
  cause: geometry_bias
  conditions:
    recon:
      bias:
        plate: 0.46
        tray: 0.46
  train_randomization:
    layout_prior: full
- name: coverage
  cause: coverage_deficit
  conditions:
    recon: {}
  train_randomization:
    layout_prior: left_half
- name: recovery
  cause: recovery_deficit
  conditions:
    recon: {}
  train_randomization:
    layout_prior: full
  open_loop:
    recovery_frac: 0.0
  feedback_pert: 0.5
  eval_mode: perturbed
  eval_pert: 0.7
- name: healthy
  cause: healthy
  conditions:
    recon: {}
  train_randomization:
    layout_prior: full
llm:
  provider: openai
  base_url: https://minara.cloud/v1
  model: openai/gpt-6.2-astra
  api_key_env: HORIZON_LLM_KEY
  max_calls: 6
  max_usd: 0.05
  max_tokens: 512
  price_in_per_mtok: 3.0
  price_out_per_mtok: 15.0
llm_overrides:
  llm_memory:
    memory:
    - past geometry scenario: large calibration residual, calibrating the twin first helped most
    - past coverage scenario: half-support demonstrations, targeted layout regeneration helped most
    - past healthy scenario: already successful, stopping saved budget
    - past perturbed scenario: recovery demonstrations did not change the outcome
  llm_minimal:
    allowed_actions:
    - calibrate_geometry
    - dagger_round
    - stop
  llm_cheap:
    model: openai/gpt-6-luna
